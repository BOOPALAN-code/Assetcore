<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetCore - Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 20px;
}
.login-box {
  background: white;
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
  width: 100%;
  max-width: 420px;
  overflow: hidden;
}
.header {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  padding: 40px 30px;
  text-align: center;
  color: white;
}
.header h1 { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
.header p { font-size: 14px; opacity: 0.9; }
.form-area { padding: 30px; }
.error-box {
  background: #fee2e2;
  border: 1px solid #fca5a5;
  color: #dc2626;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: 14px;
  display: none;
}
.input-group { margin-bottom: 18px; }
.input-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}
.input-group select,
.input-group input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #e5e7eb;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
}
.input-group select:focus,
.input-group input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
}
.login-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
.info-box {
  background: #fef3c7;
  border: 1px solid #fbbf24;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
  text-align: center;
}
.info-box p { font-size: 12px; color: #92400e; }
.info-box strong { font-family: monospace; }
.footer {
  text-align: center;
  padding: 15px 30px 20px;
  border-top: 1px solid #e5e7eb;
  font-size: 12px;
  color: #6b7280;
}
</style>
</head>
<body>
<div class="login-box">
  <div class="header">
    <h1>AssetCore</h1>
    <p>Asset Maintenance Management System</p>
  </div>
  
  <div class="form-area">
    <div class="error-box" id="error-box"></div>
    
    <form onsubmit="doLogin(event)">
      <div class="input-group">
        <label>Select Location / Branch</label>
        <select id="location" required>
          <option value="">-- Select Location --</option>
        </select>
      </div>
      
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      
      <button type="submit" class="login-btn" id="login-btn">Sign In</button>
    </form>
    
    <div class="info-box">
      <p>Default Login: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
  </div>
  
  <div class="footer">
    Multi-Location Asset Management System
  </div>
</div>

<script>
async function loadLocations() {
  try {
    const res = await fetch('/api/locations');
    const data = await res.json();
    const select = document.getElementById('location');
    
    data.forEach(loc => {
      const opt = document.createElement('option');
      opt.value = loc.code;
      opt.textContent = loc.name + ' (' + loc.code + ')';
      select.appendChild(opt);
    });
  } catch (err) {
    showError('Error loading locations');
  }
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLogin(e) {
  e.preventDefault();
  
  const location = document.getElementById('location').value;
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  
  if (!location) {
    showError('Please select a location');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ location, username, password })
    });
    
    const data = await res.json();
    
    if (res.ok && data.status === 'success') {
      window.location.href = '/';
    } else {
      showError(data.error || 'Login failed');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch (err) {
    showError('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

// Check if already logged in
(async function checkAuth() {
  try {
    const res = await fetch('/api/check-auth');
    const data = await res.json();
    if (data.authenticated) {
      window.location.href = '/';
    }
  } catch(e) {}
})();

loadLocations();
</script>
</body>
</html>
