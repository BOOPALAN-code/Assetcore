<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetCore - Login</title>
<style>
:root {
  --accent: #2563eb;
  --accent-dark: #1d4ed8;
  --text: #0f172a;
  --text-dim: #475569;
  --border: #e2e8f0;
  --surface: #ffffff;
  --danger: #ef4444;
  --success: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 20px;
}
.container {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  width: 100%;
  max-width: 440px;
  overflow: hidden;
  animation: slideUp 0.5s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  padding: 40px 30px;
  text-align: center;
  color: white;
}
.logo {
  width: 60px;
  height: 60px;
  background: rgba(255,255,255,0.2);
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 15px;
}
.logo svg { width: 32px; height: 32px; }
.header h1 { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
.header p { font-size: 13px; opacity: 0.9; }
.body { padding: 35px 30px; }
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.input-wrap { position: relative; }
.input-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-dim);
}
.form-input {
  width: 100%;
  padding: 14px 14px 14px 45px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  transition: all 0.2s;
  outline: none;
}
.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
}
select.form-input {
  padding-left: 45px;
  cursor: pointer;
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
}
.login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
.error-msg {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--danger);
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.error-msg.show { display: block; }
.footer {
  text-align: center;
  padding: 20px 30px 25px;
  border-top: 1px solid var(--border);
}
.default-creds {
  background: #fef3c7;
  border: 1px solid #f59e0b;
  border-radius: 10px;
  padding: 12px 15px;
  margin-top: 12px;
}
.default-creds p { font-size: 11px; color: #92400e; margin-bottom: 4px; }
.default-creds strong { font-size: 12px; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <h1>AssetCore</h1>
    <p>Asset Maintenance Management System</p>
  </div>
  
  <div class="body">
    <div class="error-msg" id="error-msg">
      <span id="error-text">Invalid credentials</span>
    </div>
    
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Location / Branch</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <select class="form-input" id="location" required>
            <option value="">Select Location...</option>
          </select>
        </div>
      </div>
      
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" class="form-input" id="username" placeholder="Enter username" required autocomplete="username">
        </div>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" class="form-input" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
      </div>
      
      <button type="submit" class="login-btn" id="login-btn">
        Sign In
      </button>
    </form>
    
    <div class="default-creds">
      <p>Default Credentials:</p>
      <strong>admin / admin123</strong>
    </div>
  </div>
  
  <div class="footer">
    <p>Multi-Location Asset Management System</p>
  </div>
</div>

<script>
async function loadLocations() {
  try {
    const res = await fetch('/api/locations');
    const locations = await res.json();
    const select = document.getElementById('location');
    locations.forEach(loc => {
      const option = document.createElement('option');
      option.value = loc.code;
      option.textContent = `${loc.name} (${loc.code})`;
      select.appendChild(option);
    });
  } catch (err) {
    console.error(err);
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  document.getElementById('error-text').textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error-msg').classList.remove('show');
}

async function handleLogin(e) {
  e.preventDefault();
  hideError();
  
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const location = document.getElementById('location').value;
  
  if (!location) {
    showError('Please select a location');
    btn.disabled = false;
    btn.textContent = 'Sign In';
    return;
  }
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, location })
    });
    
    const data = await res.json();
    
    if (res.ok && data.status === 'success') {
      window.location.href = '/';
    } else {
      showError(data.error || 'Login failed');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch (err) {
    showError('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

(async function() {
  try {
    const res = await fetch('/api/check-auth');
    const data = await res.json();
    if (data.authenticated) {
      window.location.href = '/';
    }
  } catch(e) {}
})();

loadLocations();
</script>
</body>
</html>
