<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetCore - Select Location</title>
<style>
:root {
  --accent: #2563eb;
  --accent-dark: #1d4ed8;
  --text: #0f172a;
  --text-dim: #475569;
  --border: #e2e8f0;
  --surface: #ffffff;
  --danger: #ef4444;
  --success: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 20px;
}
.container {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  width: 100%;
  max-width: 600px;
  overflow: hidden;
  animation: slideUp 0.5s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  padding: 30px;
  text-align: center;
  color: white;
}
.header h1 { font-size: 24px; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.9; }
.body { padding: 30px; }
.user-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-avatar {
  width: 48px;
  height: 48px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
  font-weight: bold;
}
.user-details h3 { font-size: 16px; color: var(--text); }
.user-details p { font-size: 13px; color: var(--text-dim); }
.location-list { display: flex; flex-direction: column; gap: 12px; }
.location-card {
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 16px;
}
.location-card:hover {
  border-color: var(--accent);
  background: rgba(37, 99, 235, 0.05);
  transform: translateY(-2px);
}
.location-icon {
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
  flex-shrink: 0;
}
.location-info { flex: 1; }
.location-info h3 { font-size: 16px; color: var(--text); margin-bottom: 4px; }
.location-info p { font-size: 13px; color: var(--text-dim); }
.location-arrow { color: var(--text-dim); font-size: 20px; }
.btn-logout {
  width: 100%;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--danger);
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s;
}
.btn-logout:hover { background: rgba(239, 68, 68, 0.1); }
.footer {
  text-align: center;
  padding: 20px 30px 25px;
  border-top: 1px solid var(--border);
}
.footer p { font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Select Location</h1>
    <p>Choose your branch/office to continue</p>
  </div>
  
  <div class="body">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">A</div>
      <div class="user-details">
        <h3 id="username">Admin</h3>
        <p id="user-email">Logged in</p>
      </div>
    </div>
    
    <h3 style="font-size:13px;color:var(--text-dim);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">
      Available Locations
    </h3>
    
    <div class="location-list" id="location-list">
      <div style="text-align:center;padding:20px;color:var(--text-dim)">Loading locations...</div>
    </div>
    
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
  
  <div class="footer">
    <p>Each location has separate database and data</p>
  </div>
</div>

<script>
async function loadPage() {
  try {
    const authRes = await fetch('/api/check-auth');
    const auth = await authRes.json();
    
    if (!auth.authenticated) {
      window.location.href = '/login.html';
      return;
    }
    
    document.getElementById('username').textContent = auth.username;
    document.getElementById('user-avatar').textContent = auth.username.charAt(0).toUpperCase();
    
    const locRes = await fetch('/api/locations');
    const locations = await locRes.json();
    
    const list = document.getElementById('location-list');
    
    if (locations.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-dim)">No locations available</div>';
      return;
    }
    
    list.innerHTML = locations.map(loc => `
      <div class="location-card" onclick="selectLocation('${loc.code}', '${loc.name}')">
        <div class="location-icon">🏢</div>
        <div class="location-info">
          <h3>${loc.name}</h3>
          <p>${loc.address || loc.code}</p>
        </div>
        <div class="location-arrow">→</div>
      </div>
    `).join('');
    
  } catch (err) {
    console.error(err);
    document.getElementById('location-list').innerHTML = 
      '<div style="text-align:center;padding:20px;color:var(--danger)">Error loading locations</div>';
  }
}

async function selectLocation(code, name) {
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').textContent,
        password: 'location-select',
        location: code
      })
    });
    
    if (res.ok) {
      window.location.href = '/';
    } else {
      alert('Error selecting location');
    }
  } catch (err) {
    alert('Connection error');
  }
}

async function logout() {
  try {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login.html';
  } catch (err) {
    window.location.href = '/login.html';
  }
}

loadPage();
</script>
</body>
</html>
