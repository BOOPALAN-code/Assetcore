<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetCore - Select Location</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 40px 20px;
}
.container {
  max-width: 700px;
  margin: 0 auto;
}
.header {
  text-align: center;
  color: white;
  margin-bottom: 30px;
}
.header h1 { font-size: 32px; margin-bottom: 8px; }
.header p { font-size: 16px; opacity: 0.9; }
.user-bar {
  background: white;
  border-radius: 12px;
  padding: 15px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 45px;
  height: 45px;
  background: #2563eb;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
.user-details h3 { font-size: 16px; color: #1f2937; }
.user-details p { font-size: 13px; color: #6b7280; }
.logout-btn {
  padding: 10px 20px;
  background: #fee2e2;
  color: #dc2626;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.logout-btn:hover { background: #fecaca; }
.location-grid {
  display: grid;
  gap: 15px;
}
.location-card {
  background: white;
  border-radius: 16px;
  padding: 25px;
  display: flex;
  align-items: center;
  gap: 20px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: all 0.2s;
  border: 2px solid transparent;
}
.location-card:hover {
  transform: translateY(-3px);
  border-color: #2563eb;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.loc-icon {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.loc-info h3 { font-size: 18px; color: #1f2937; margin-bottom: 5px; }
.loc-info p { font-size: 14px; color: #6b7280; }
.loc-arrow { margin-left: auto; font-size: 24px; color: #9ca3af; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Select Your Location</h1>
    <p>Choose your branch to access your asset data</p>
  </div>
  
  <div class="user-bar">
    <div class="user-info">
      <div class="avatar" id="avatar">A</div>
      <div class="user-details">
        <h3 id="username">User</h3>
        <p>Logged in</p>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  
  <div class="location-grid" id="location-grid">
    <p style="text-align:center;color:white;">Loading locations...</p>
  </div>
</div>

<script>
async function loadPage() {
  try {
    const authRes = await fetch('/api/check-auth');
    const auth = await authRes.json();
    
    if (!auth.authenticated) {
      window.location.href = '/login.html';
      return;
    }
    
    document.getElementById('username').textContent = auth.username;
    document.getElementById('avatar').textContent = auth.username.charAt(0).toUpperCase();
    
    const locRes = await fetch('/api/locations');
    const locations = await locRes.json();
    
    const icons = {'HQ': '🏢', 'CHN': '🏙️', 'HSR': '🏭'};
    const grid = document.getElementById('location-grid');
    
    grid.innerHTML = locations.map(loc => `
      <div class="location-card" onclick="selectLocation('${loc.code}')">
        <div class="loc-icon">${icons[loc.code] || '📍'}</div>
        <div class="loc-info">
          <h3>${loc.name}</h3>
          <p>${loc.address || loc.code}</p>
        </div>
        <div class="loc-arrow">→</div>
      </div>
    `).join('');
    
  } catch (err) {
    console.error(err);
  }
}

async function selectLocation(code) {
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').textContent,
        password: 'select',
        location: code
      })
    });
    
    if (res.ok) {
      window.location.href = '/';
    }
  } catch (err) {
    console.error(err);
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

loadPage();
</script>
</body>
</html>
